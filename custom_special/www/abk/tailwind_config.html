<style>
/* ============================================================
   ABK Portal — Embedded Animations
   Langsung di <style> agar tidak bergantung pada bench build
   ============================================================ */

/* --- Blob floating --- */
@keyframes abkBlobFloat {
    0%, 100% { transform: translateY(0px) scale(1); }
    33%       { transform: translateY(-22px) scale(1.04); }
    66%       { transform: translateY(10px) scale(0.97); }
}
.anim-blob      { animation: abkBlobFloat 8s ease-in-out infinite; }
.anim-blob-slow { animation: abkBlobFloat 12s ease-in-out infinite; animation-delay: -4s; }
.anim-blob-med  { animation: abkBlobFloat 10s ease-in-out infinite; animation-delay: -6s; }

/* --- Floating emoji / icons --- */
@keyframes abkFloatUp {
    0%   { opacity: 0;   transform: translateY(50px) rotate(-8deg) scale(0.8); }
    10%  { opacity: 0.7; }
    85%  { opacity: 0.5; }
    100% { opacity: 0;   transform: translateY(-110px) rotate(8deg) scale(1.1); }
}
.anim-float-icon { animation: abkFloatUp 12s linear infinite; }

/* --- Twinkling stars --- */
@keyframes abkTwinkle {
    0%, 100% { opacity: 0;   transform: scale(0.4) rotate(0deg); }
    50%       { opacity: 0.9; transform: scale(1) rotate(15deg); }
}
.anim-twinkle { animation: abkTwinkle 2.5s ease-in-out infinite; }

/* --- Hero text fade+slide up --- */
@keyframes abkSlideUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
}
.anim-slide-up          { opacity: 0; animation: abkSlideUp 0.75s cubic-bezier(0.22,1,0.36,1) forwards; }
.anim-delay-1           { animation-delay: 0.10s; }
.anim-delay-2           { animation-delay: 0.25s; }
.anim-delay-3           { animation-delay: 0.42s; }
.anim-delay-4           { animation-delay: 0.60s; }
.anim-delay-5           { animation-delay: 0.80s; }

/* --- Badge pop --- */
@keyframes abkBadgePop {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
}
.anim-badge-pop { opacity: 0; animation: abkBadgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* --- CTA button glow pulse --- */
@keyframes abkPulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(249,115,22,0.45); }
    50%       { box-shadow: 0 0 0 14px rgba(249,115,22,0); }
}
.anim-pulse-glow { animation: abkPulseGlow 2.4s ease-in-out infinite; }

/* --- Gradient text --- */
.abk-gradient-text {
    background: linear-gradient(135deg, #F97316, #EC4899, #8B5CF6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* --- Wavy underline on gradient text --- */
.abk-wavy-underline {
    text-decoration: underline;
    text-decoration-style: wavy;
    text-decoration-color: #FBBF24;
    text-decoration-thickness: 3px;
    text-underline-offset: 6px;
    -webkit-text-fill-color: transparent; /* keep gradient on text, underline separate */
}

/* --- Scroll reveal (JS adds .is-visible) --- */
.abk-reveal {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.8s cubic-bezier(0.22,1,0.36,1),
                transform 0.8s cubic-bezier(0.22,1,0.36,1);
}
.abk-reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
}

/* --- Prefers reduced motion --- */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

<script>
/* Scroll-reveal: tambahkan .is-visible saat section masuk viewport */
(function () {
    function initReveal() {
        var els = document.querySelectorAll('.abk-reveal');
        if (!els.length) return;

        /* Langsung tampilkan jika sudah dalam viewport saat load */
        function checkVisible(el) {
            var rect = el.getBoundingClientRect();
            return rect.top < window.innerHeight - 60;
        }

        if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (e.isIntersecting) {
                        e.target.classList.add('is-visible');
                        io.unobserve(e.target);
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

            els.forEach(function (el) {
                if (checkVisible(el)) {
                    el.classList.add('is-visible'); /* sudah terlihat langsung tampil */
                } else {
                    io.observe(el);
                }
            });
        } else {
            /* Fallback: tampilkan semua */
            els.forEach(function (el) { el.classList.add('is-visible'); });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initReveal);
    } else {
        initReveal();
    }
})();
</script>
